services:
  task28-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: task28-api
    env_file:
      - .env

    ports:
      - "8000:10000"

    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    volumes:
      - ./app.py:/app/app.py:ro

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:10000/healthz')"
        ]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3G

    restart: unless-stopped